[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vendmate"
version = "0.1.0"
description = "A vending-machine simulator web app - B215 Software Testing project."
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
lint = ["flake8>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vendmate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["vendmate"]
omit = ["vendmate/templates/*"]
