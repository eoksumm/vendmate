{% extends "base.html" %}
{% block title %}Register - VendMate{% endblock %}
{% block content %}
  <h1>Create an account</h1>
  <form method="post" class="stacked">
    <label>Username <input type="text" name="username" required></label>
    <label>Password (min. 4 characters) <input type="password" name="password" required minlength="4"></label>
    <button type="submit">Register</button>
  </form>
{% endblock %}
